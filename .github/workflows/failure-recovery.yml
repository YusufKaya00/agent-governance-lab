name: Failure Recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recovery:
    name: Bounded Retry
    runs-on: ubuntu-latest

    outputs:
      result: ${{ steps.run_task.outputs.result }}

    steps:
      - name: Run task with bounded retries
        id: run_task
        shell: bash
        run: |
          max_attempts=3

          for attempt in 1 2 3; do
            echo "Attempt $attempt of $max_attempts"

            # Simulate permanent failure
            echo "Task failed"

            sleep 2
          done

          echo "Task failed after $max_attempts attempts"
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 0

  escalate:
    name: Human Escalation
    needs: recovery
    if: needs.recovery.outputs.result == 'failed'
    runs-on: ubuntu-latest

    steps:
      - name: Create escalation report
        env:
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "AUTOMATION ESCALATION"
          echo "Run ID: $RUN_ID"
          echo "Branch: $BRANCH"
          echo "Failure threshold reached."
          echo "Suggested action: human investigation."
