name: State Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-state:
    name: Validate Task State
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PR has linked issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! echo "$PR_BODY" | grep -Eq 'Closes #[0-9]+|Fixes #[0-9]+|Resolves #[0-9]+'; then
            echo "No linked issue found."
            exit 1
          fi

          echo "Linked issue found."

      - name: Check required implementation
        run: |
          test -f health.json
          echo "Health implementation exists."

      - name: Show current state
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "PR: #${{ github.event.pull_request.number }}"

      - name: Validate current acceptance behavior
        run: |
          node -e '
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("health.json", "utf8")
          );

          if (data.status !== "ok") {
            console.error("Context drift detected: expected status=ok");
            process.exit(1);
          }

          console.log("Current implementation satisfies the health requirement.");
          '
