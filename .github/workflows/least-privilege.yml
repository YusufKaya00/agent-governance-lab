name: Least Privilege

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Read Only Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Try PR write operation without permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Attempting to comment on PR #37 with read-only permissions..."
          gh pr comment 37 --body "Analysis complete (from analyze job)"

  update-pr:
    name: Update PR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Comment on PR with elevated permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Commenting on PR #37 with pull-requests: write permission..."
          gh pr comment 37 --body "Least-privilege workflow successfully updated this PR."
